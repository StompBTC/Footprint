<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Footprint</title>
<style>
:root{--bg:#0a0c10;--panel:#11141a;--line:#1f2430;--text:#c9d1d9;--muted:#6b7480;--buy:#1fa37f;--sell:#d9484a;--accent:#d8b24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0 6px 0 0;font-weight:600}
label{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
select,input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
input[type=number]{width:96px}
input[type=color]{width:34px;height:22px;padding:0 1px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer}
button{background:#1a1f2a;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4356}
button.on{background:#2a2410;border-color:#6b5a24;color:#f1d48a}
button:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:20px;background:var(--line)}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px 12px;display:grid;gap:6px;min-width:250px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.menu-pop[hidden]{display:none}
.menu-pop.wide{grid-template-columns:auto auto;column-gap:28px;align-items:start}
.menu-pop .col{display:grid;gap:6px;align-content:start}
.menu-pop label{color:var(--text);white-space:nowrap}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
.gear{padding:0 6px;font-size:13px;line-height:20px;background:none;border-color:transparent;color:var(--muted)}
.gear:hover{color:var(--text);border-color:var(--line);background:#1a1f2a}
.row3{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:11px;max-width:250px}
.mh{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#525b68;margin-top:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin:0 2px;flex:none}
#setPop{position:fixed;z-index:30;background:var(--panel);border:1px solid #2c3343;border-radius:6px;padding:10px 14px 12px;display:grid;gap:8px;min-width:260px;box-shadow:0 14px 36px rgba(0,0,0,.6)}
#setPop[hidden]{display:none}
#setPop h3{margin:0 0 2px;font-size:12.5px;font-weight:600}
#setPop .f{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--text)}
#setPop input[type=number]{width:72px}
#status{display:flex;gap:16px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#555;margin-right:4px}
.dot.ok{background:var(--buy)}.dot.wait{background:var(--accent)}.dot.err{background:var(--sell)}
.ven{display:inline-flex;align-items:center;gap:4px}
.pos{color:var(--buy)}.neg{color:var(--sell)}.warn{color:var(--accent)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{cursor:crosshair}
#ov{pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(17,20,26,.97);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:11px ui-monospace,Consolas,monospace;white-space:pre;display:none;z-index:2}
#pauseBadge{position:absolute;top:32px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(40,34,14,.95);border:1px solid #6b5a24;color:#f1d48a;padding:4px 6px 4px 12px;border-radius:16px;font-size:12px;display:none;align-items:center;gap:10px}
#pauseBadge button{padding:2px 10px;border-radius:12px}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>BTC-USD Footprint</h1>
  <label>Timeframe <select id="tf">
    <option value="1">1m</option><option value="5">5m</option><option value="15">15m</option>
    <option value="30">30m</option><option value="60">1h</option></select></label>
  <label>Row <select id="row">
    <option value="auto">Auto</option><option value="5">$5</option><option value="10">$10</option>
    <option value="25">$25</option><option value="50">$50</option><option value="100">$100</option>
    <option value="250">$250</option><option value="500">$500</option></select></label>
  <label>Cells <select id="mode">
    <option value="delta">Delta</option><option value="bidask">Sell × Buy</option><option value="vol">Volume</option></select></label>
  <label>Highlight ≥ <select id="thr">
    <option value="auto">Auto</option><option value="100000">$100K</option><option value="250000">$250K</option>
    <option value="500000">$500K</option><option value="1000000">$1M</option><option value="2000000">$2M</option>
    <option value="5000000">$5M</option><option value="10000000">$10M</option></select></label>
  <label>Units <select id="units"><option value="usd">USD</option><option value="btc">BTC</option></select></label>
  <label>Profile <select id="prof">
    <option value="visible">Visible</option><option value="session">Session (UTC day)</option><option value="all">All stored</option></select></label>
  <span class="sep"></span>
  <label><input type="checkbox" id="candles"> Candles</label>
  <div class="menu"><button id="indBtn">Indicators ▾</button><div id="indMenu" class="menu-pop wide" hidden></div></div>
  <div class="menu"><button id="panBtn">Panels ▾</button><div id="panMenu" class="menu-pop" hidden></div></div>
  <label><input type="checkbox" id="abs"> Absorption</label>
  <label><input type="checkbox" id="bubbles"> Bubbles ≥ $</label>
  <input type="number" id="bigMin" min="25000" step="25000">
  <span class="sep"></span>
  <label><input type="checkbox" id="v_coinbase"> Coinbase</label>
  <label><input type="checkbox" id="v_kraken"> Kraken</label>
  <label><input type="checkbox" id="v_bitstamp"> Bitstamp</label>
  <span class="sep"></span>
  <label>Keep <select id="hours">
    <option value="6">6h</option><option value="12">12h</option><option value="24">24h</option>
    <option value="48">48h</option><option value="72">72h</option></select></label>
  <button id="pauseBtn" title="Freeze the chart while data keeps collecting (Space)">❚❚ Pause</button>
  <button id="live">Live ⟶</button>
  <button id="exportJson">Export</button>
  <button id="exportCsv">CSV</button>
  <button id="importBtn">Import</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button id="clear">Clear</button>
</header>
<div id="status"></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="tip"></div>
  <div id="pauseBadge"><span id="pauseTxt">Paused</span><button id="resumeBtn">Resume</button></div>
</div>
</div>
<div id="setPop" hidden></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ======================================================================
   Storage model
   Trades are aggregated on arrival into 1-minute base bars at $5 price rows.
   A display series (one entry per bar of the selected timeframe) and per-UTC-day
   stats are maintained incrementally as trades arrive, so drawing never has to
   rescan history. Large aggressive prints are kept separately for bubbles.
   ====================================================================== */
const BASE_MS = 60000, BASE_TICK = 5, BIG_FLOOR = 25000, BIG_MAX = 60000, DAY_MS = 86400000;
const VENUES = ["coinbase", "kraken", "bitstamp"];
const VNAME = {coinbase:"Coinbase", kraken:"Kraken", bitstamp:"Bitstamp"};

/* ---------- Settings ---------- */
const DEF = {
  tf:5, row:"auto", mode:"delta", thr:"auto", units:"usd", prof:"visible", candles:true, abs:true,
  bubbles:false, bigMin:500000, hours:24, refresh:500, venues:{coinbase:true, kraken:true, bitstamp:true},
  ph:{vol:72, rsi:96, cvd:64, macd:96, stoch:84},
  sr:{res:"#f5d020", sup:"#c084fc"},
  /* Default profile: Auto Fib (yellow resistance / purple support), SMA 200 (white) and RSI.
    Everything else starts off, in a cool blue/grey palette that stays
     clear of the yellow/purple support-resistance colors. */
  ind:{
    vwap:{on:false, color:"#38bdf8", width:2},
    vwapB:{on:false, m1:1, m2:2, color:"#38bdf8", width:1},
    ema1:{on:false, len:9, color:"#7dd3fc", width:1.5},
    ema2:{on:false, len:21, color:"#3b82f6", width:1.5},
    ema3:{on:false, len:50, color:"#94a3b8", width:1.5},
    ema4:{on:false, len:200, color:"#cbd5e1", width:1.5},
    sma1:{on:false, len:20, color:"#67e8f9", width:1.5},
    sma2:{on:false, len:50, color:"#0ea5e9", width:1.5},
    sma3:{on:true, len:200, color:"#ffffff", width:2},
    bb:{on:false, len:20, mult:2, color:"#64748b", width:1},
    ichi:{on:false, conv:9, base:26, spanB:52, disp:26, tenkan:"#3b82f6", kijun:"#e2e8f0", up:"#22c08f", down:"#ef5054"},
    lvOpen:{on:false, color:"#94a3b8", auto:false},
    lvDay:{on:false, color:"#e2e8f0", auto:false},
    lvPrior:{on:false, color:"#94a3b8", auto:true},
    lvPvwap:{on:false, color:"#38bdf8", auto:false},
    fib:{on:true, anchor:"visible", customH:6, res:"#f5d020", sup:"#c084fc"}
  },
  pan:{
    vol:{on:true, maLen:20, up:"#22c08f", down:"#ef5054", ma:"#94a3b8"},
    rsi:{on:true, len:14, ob:70, os:30, line:"#7dd3fc", obc:"#ef5054", osc:"#22c08f", lvl:"#4b5563", width:2, shade:false},
    cvd:{on:false, reset:"visible"},
    macd:{on:false, fast:12, slow:26, sig:9, macd:"#7dd3fc", signal:"#e2e8f0"},
    stoch:{on:false, rsiLen:14, stLen:14, k:3, d:3, ob:80, os:20, kc:"#7dd3fc", dc:"#e2e8f0"}
  }
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(dst, src) {
  if (!src || typeof src !== "object") return dst;
  for (const k in dst) {
    if (!(k in src)) continue;
    if (dst[k] && typeof dst[k] === "object") merge(dst[k], src[k]);
    else if (src[k] !== null && typeof src[k] !== "object") dst[k] = src[k];
  }
  return dst;
}
const cfg = clone(DEF);
try { merge(cfg, JSON.parse(localStorage.getItem("fp_cfg5") || "null")); } catch (e) {}
function saveCfg() { try { localStorage.setItem("fp_cfg5", JSON.stringify(cfg)); } catch (e) {} }
let PV = 0;   // bumps whenever an indicator setting changes

/* ---------- State ---------- */
const S = {bars:new Map(), keys:[], keysDirty:false, big:[], acc:{}, last:null, lastTs:0,
           vDelta:{}, vCount:{}, unsaved:0, total:0, dirtyData:true, rate:[]};
VENUES.forEach(v => { S.vDelta[v] = 0; S.vCount[v] = 0; });
const SER = {tf:null, dirty:true, ver:0, live:0, T:[], O:[], H:[], L:[], C:[], F:[], Z:[], B:[], Sv:[], VU:[], dv:[], idx:new Map()};
const DAYS = new Map();          // UTC day -> {o,h,l,c,f,z,mins,sv,spv,sp2v}
const rowCache = new Map();      // display bar time -> {rs, res}
const PAUSE = {on:false, T:0, price:null, n0:0};

function addTrade(v, ts, p, q, side) {
  if (!(p > 0 && q > 0 && isFinite(ts))) return;
  const t = Math.floor(ts / BASE_MS) * BASE_MS;
  let b = S.bars.get(t), newBar = false;
  if (!b) {
    b = {t, o:p, h:p, l:p, c:p, f:ts, z:ts, rows:new Map()}; S.bars.set(t, b); newBar = true;
    const ks = S.keys; if (!S.keysDirty && (!ks.length || t > ks[ks.length - 1])) ks.push(t); else S.keysDirty = true;
  }
  if (ts < b.f) { b.f = ts; b.o = p; } if (ts >= b.z) { b.z = ts; b.c = p; }
  if (p > b.h) b.h = p; if (p < b.l) b.l = p;
  const r = Math.floor(p / BASE_TICK), buy = side === "buy";
  let c = b.rows.get(r); if (!c) { c = [0, 0]; b.rows.set(r, c); }
  if (buy) c[0] += q; else c[1] += q;
  const pm = (r + 0.5) * BASE_TICK, dd = Math.floor(ts / DAY_MS);
  let D = DAYS.get(dd);
  if (!D) { D = {o:p, h:p, l:p, c:p, f:ts, z:ts, mins:0, sv:0, spv:0, sp2v:0}; DAYS.set(dd, D); }
  if (newBar) D.mins++;
  if (ts < D.f) { D.f = ts; D.o = p; } if (ts >= D.z) { D.z = ts; D.c = p; } if (p > D.h) D.h = p; if (p < D.l) D.l = p;
  D.sv += q; D.spv += pm * q; D.sp2v += pm * pm * q;
  if (!SER.dirty && SER.tf) serAdd(ts, p, q, buy, pm, dd, D);
  if (ts >= S.lastTs) { S.lastTs = ts; S.last = p; }
  S.vDelta[v] += buy ? q : -q; S.vCount[v]++; S.unsaved++; S.total++; S.dirtyData = true; S.rate.push(Date.now());
  const a = S.acc[v];
  if (a && a.side === side && Math.abs(ts - a.ts) <= 150) { a.q += q; a.pq += p * q; }
  else { flushAcc(v); S.acc[v] = {side, ts, q, pq:p * q, at:Date.now()}; }
}
function serAdd(ts, p, q, buy, pm, dd, D) {
  const tfMs = SER.tf * 60000, T = Math.floor(ts / tfMs) * tfMs, n = SER.T.length;
  let i = SER.idx.get(T);
  if (i === undefined) {
    if (n && T < SER.T[n - 1]) { SER.dirty = true; return; }   // rare out-of-order bar: rebuild on next draw
    i = n; SER.idx.set(T, i); SER.T.push(T); SER.O.push(p); SER.H.push(p); SER.L.push(p); SER.C.push(p);
    SER.F.push(ts); SER.Z.push(ts); SER.B.push(0); SER.Sv.push(0); SER.VU.push(0); SER.dv.push(null); SER.ver++;
  }
  if (ts < SER.F[i]) { SER.F[i] = ts; SER.O[i] = p; } if (ts >= SER.Z[i]) { SER.Z[i] = ts; SER.C[i] = p; }
  if (p > SER.H[i]) SER.H[i] = p; if (p < SER.L[i]) SER.L[i] = p;
  if (buy) SER.B[i] += q; else SER.Sv[i] += q; SER.VU[i] += q * pm;
  if (i === SER.T.length - 1) SER.dv[i] = [D.sv, D.spv, D.sp2v];
  else for (let j = i; j < SER.T.length && Math.floor(SER.T[j] / DAY_MS) === dd; j++) { const x = SER.dv[j]; if (x) { x[0] += q; x[1] += pm * q; x[2] += pm * pm * q; } }
  rowCache.delete(T); SER.live++;
}
function flushAcc(v) {
  const a = S.acc[v]; if (!a) return; S.acc[v] = null;
  if (a.pq >= BIG_FLOOR) { S.big.push({t:a.ts, p:a.pq / a.q, q:a.q, s:a.side === "buy" ? 1 : -1, v}); if (S.big.length > BIG_MAX) S.big.splice(0, S.big.length - BIG_MAX); }
}
function sortedKeys() { if (S.keysDirty) { S.keys = [...S.bars.keys()].sort((a, b) => a - b); S.keysDirty = false; } return S.keys; }
function lowerBound(arr, x) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; } return lo; }
function lowerBig(t) { let lo = 0, hi = S.big.length; while (lo < hi) { const m = (lo + hi) >> 1; if (S.big[m].t < t) lo = m + 1; else hi = m; } return lo; }

function rebuildSeries() {
  const tfMs = cfg.tf * 60000;
  Object.assign(SER, {tf:cfg.tf, dirty:false, T:[], O:[], H:[], L:[], C:[], F:[], Z:[], B:[], Sv:[], VU:[], dv:[], idx:new Map()});
  SER.ver++; SER.live++; DAYS.clear(); rowCache.clear();
  for (const t of sortedKeys()) {
    const b = S.bars.get(t), T = Math.floor(t / tfMs) * tfMs, dd = Math.floor(t / DAY_MS);
    let i = SER.idx.get(T);
    if (i === undefined) { i = SER.T.length; SER.idx.set(T, i); SER.T.push(T); SER.O.push(b.o); SER.H.push(b.h); SER.L.push(b.l); SER.C.push(b.c);
      SER.F.push(b.f); SER.Z.push(b.z); SER.B.push(0); SER.Sv.push(0); SER.VU.push(0); SER.dv.push(null); }
    else { if (b.h > SER.H[i]) SER.H[i] = b.h; if (b.l < SER.L[i]) SER.L[i] = b.l;
      if (b.f < SER.F[i]) { SER.F[i] = b.f; SER.O[i] = b.o; } if (b.z >= SER.Z[i]) { SER.Z[i] = b.z; SER.C[i] = b.c; } }
    let D = DAYS.get(dd);
    if (!D) { D = {o:b.o, h:b.h, l:b.l, c:b.c, f:b.f, z:b.z, mins:0, sv:0, spv:0, sp2v:0}; DAYS.set(dd, D); }
    else { if (b.h > D.h) D.h = b.h; if (b.l < D.l) D.l = b.l; if (b.f < D.f) { D.f = b.f; D.o = b.o; } if (b.z >= D.z) { D.z = b.z; D.c = b.c; } }
    D.mins++;
    for (const [r, c] of b.rows) { const pm = (r + 0.5) * BASE_TICK, v = c[0] + c[1];
      SER.B[i] += c[0]; SER.Sv[i] += c[1]; SER.VU[i] += v * pm; D.sv += v; D.spv += pm * v; D.sp2v += pm * pm * v; }
    SER.dv[i] = [D.sv, D.spv, D.sp2v];
  }
}
function ensureSeries() { if (SER.dirty || SER.tf !== cfg.tf) rebuildSeries(); }

function prune() {
  const cut = Date.now() - cfg.hours * 3600e3; let n = 0;
  for (const t of S.bars.keys()) if (t < cut) { S.bars.delete(t); n++; }
  if (n) { S.keys = sortedKeys().filter(t => t >= cut); SER.dirty = true; needBase = true; }
  if (S.big.length && S.big[0].t < cut) S.big = S.big.slice(lowerBig(cut));
}

/* ---------- Exchange feeds (public, read-only, no keys) ---------- */
function parseTime(s) { return Date.parse(String(s).replace(/(\.\d{3})\d+/, "$1")); }
function makeFeed(name, url, subs, parse, staleMs, keepalive) {
  const f = {name, state:"off", ws:null, lastMsg:0, retry:0, timer:null, ka:null, staleMs};
  f.connect = () => {
    clearTimeout(f.timer);
    if (!cfg.venues[name]) { f.state = "off"; return; }
    f.state = "wait"; let ws;
    try { ws = new WebSocket(url); } catch (e) { f.state = "err"; return f.sched(); }
    f.ws = ws;
    ws.onopen = () => { subs.forEach(m => ws.send(JSON.stringify(m))); f.lastMsg = Date.now(); f.retry = 0;
      if (keepalive) { clearInterval(f.ka); f.ka = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify(keepalive)); }, 20000); } };
    ws.onmessage = e => { if (f.ws !== ws) return; f.lastMsg = Date.now(); let m; try { m = JSON.parse(e.data); } catch (x) { return; } f.state = "ok"; parse(m, f); };
    ws.onerror = () => { if (f.ws === ws) f.state = "err"; };
    ws.onclose = () => { if (f.ws !== ws) return; f.ws = null; clearInterval(f.ka); f.state = "err"; f.sched(); };
  };
  f.sched = () => { clearTimeout(f.timer); const d = Math.min(30000, 1000 * 2 ** f.retry++); f.timer = setTimeout(f.connect, d); };
  f.close = () => { f.state = "off"; clearTimeout(f.timer); clearInterval(f.ka); if (f.ws) { const w = f.ws; f.ws = null; try { w.close(); } catch (e) {} } };
  f.reconnect = () => { f.close(); f.connect(); };
  return f;
}
const FEEDS = {
  // Coinbase Advanced Trade: "side" is the MAKER side, so the aggressor is the opposite.
  coinbase: makeFeed("coinbase", "wss://advanced-trade-ws.coinbase.com",
    [{type:"subscribe", channel:"market_trades", product_ids:["BTC-USD"]}, {type:"subscribe", channel:"heartbeats"}],
    m => { if (m.channel !== "market_trades") return;
      for (const ev of m.events || []) { if (ev.type !== "update") continue;
        for (const t of ev.trades || []) addTrade("coinbase", parseTime(t.time), +t.price, +t.size, t.side === "BUY" ? "sell" : "buy"); } },
    60000),
  // Kraken WS v2: "side" is the TAKER side.
  kraken: makeFeed("kraken", "wss://ws.kraken.com/v2",
    [{method:"subscribe", params:{channel:"trade", symbol:["BTC/USD"], snapshot:false}}],
    m => { if (m.channel !== "trade" || m.type !== "update") return;
      for (const t of m.data || []) addTrade("kraken", parseTime(t.timestamp), +t.price, +t.qty, t.side === "buy" ? "buy" : "sell"); },
    60000),
  // Bitstamp WS v2: type 0 = buy taker, 1 = sell taker (verify with the per-venue delta readout).
  bitstamp: makeFeed("bitstamp", "wss://ws.bitstamp.net",
    [{event:"bts:subscribe", data:{channel:"live_trades_btcusd"}}],
    (m, f) => { if (m.event === "bts:request_reconnect") { f.reconnect(); return; }
      if (m.event !== "trade" || !m.data || m.data.price == null) return;
      const d = m.data, ts = d.microtimestamp ? Math.floor(+d.microtimestamp / 1000) : +d.timestamp * 1000;
      addTrade("bitstamp", ts, +d.price, +d.amount, +d.type === 0 ? "buy" : "sell"); },
    120000, {event:"bts:heartbeat"})
};
setInterval(() => {

  { const items = [];

      lines.push(`${iso},${r * BASE_TICK},${(r + 1) * BASE_TICK},${c[0].toFixed(8)},${c[1].toFixed(8)},${(c[0] - c[1]).toFixed(8)}`); }

function importJson(text) {

    if (ex) { let ev = 0; for (const x of ex.rows.values()) ev += x[0] + x[1]; if (ev >= vol) { skipped++; continue; } }

  }
  const seen = new Set(S.big.map(b => b.t + "|" + b.v + "|" + b.q.toFixed(8)));
  for (const b of d.big || []) { const k = b[0] + "|" + b[4] + "|" + (+b[2]).toFixed(8); if (seen.has(k)) continue; seen.add(k); S.big.push({t:b[0], p:b[1], q:b[2], s:b[3], v:b[4]}); }

}

bind("thr", "thr", v => v === "auto" ? "auto" : Number(v)); bind("prof", "prof", v => v);
bind("candles", "candles"); bind("abs", "abs"); bind("bubbles", "bubbles");
bind("bigMin", "bigMin", v => Math.max(BIG_FLOOR, Number(v) || 500000), () => { $("bigMin").value = cfg.bigMin; });
bind("hours", "hours", Number, prune);
VENUES.forEach(v => { const el = $("v_" + v); el.checked = !!cfg.venues[v];
  el.onchange = () => { cfg.venues[v] = el.checked; saveCfg(); if (el.checked) FEEDS[v].connect(); else FEEDS[v].close(); updateStatus(); }; });

/* ---------- Indicator & panel menus ---------- */
const indMenu = $("indMenu"), panMenu = $("panMenu"), setPop = $("setPop");
function itemHTML(scope, key) {
  const meta = scope === "ind" ? IMETA[key] : PMETA[key], c = scope === "ind" ? cfg.ind[key] : cfg.pan[key];
  const sw = key === "fib" ? `linear-gradient(90deg,${c.res} 50%,${c.sup} 50%)` : c.auto ? `linear-gradient(90deg,${cfg.sr.res} 50%,${cfg.sr.sup} 50%)` : swatchOf(c);
  return `<div class="item"><label><input type="checkbox" data-on="${scope}:${key}"${c.on ? " checked" : ""}><span class="sw" style="background:${sw}"></span><span>${meta.label(c)}</span></label><button class="gear" data-gear="${scope}:${key}" title="Settings">⚙</button></div>`;
}
function buildMenus() {
  const col = groups => groups.map(gname => `<div class="mh">${gname}</div>` + Object.keys(IMETA).filter(k => IMETA[k].group === gname).map(k => itemHTML("ind", k)).join("")).join("");
  indMenu.innerHTML = `<div class="col">${col(["VWAP (UTC day)", "Moving averages"])}</div>
    <div class="col">${col(["Bands & clouds", "Key levels", "Fibonacci"])}
      <div class="mh">Auto support / resistance colors</div>
      <div class="note">Used by key levels that have "Auto S/R" switched on in their settings.</div>
      <div class="row3"><label>Resistance <input type="color" data-sr="res" value="${cfg.sr.res}"></label><label>Support <input type="color" data-sr="sup" value="${cfg.sr.sup}"></label></div>
      <div class="mh">Profiles</div>
      <div class="note">Indicators, panels and colors. Default = Auto Fib, SMA 200, RSI, Volume.</div>
      <div class="row3"><button id="profDefault">Load default</button><button id="profSave">Save mine</button><button id="profLoad"${savedProfile() ? "" : " disabled"}>Load mine</button></div>
    </div>`;
  panMenu.innerHTML = `<div class="mh">Bottom panels</div>${PANE_ORDER.map(k => itemHTML("pan", k)).join("")}
    <div class="mh">Sizing</div>
    <div class="note">Drag the top edge of any panel to resize it. Double-click an edge to reset that panel.</div>
    <div class="row3"><button id="resetPanels">Reset panel sizes</button></div>
    <div class="mh">Performance</div>
    <label>Redraw while streaming <select id="refresh">
      <option value="250">4× per second</option><option value="500">2× per second</option><option value="1000">1× per second</option><option value="2000">every 2 seconds</option></select></label>
    <div class="note">Slower redraws use less CPU on older machines. Zoom, pan and hover always respond immediately, and data is never dropped.</div>`;
  $("refresh").value = String(cfg.refresh);
  $("profDefault").onclick = () => applyProfile(DEF);
  $("profSave").onclick = () => { try { localStorage.setItem("fp_profile", JSON.stringify({ind:cfg.ind, pan:cfg.pan, sr:cfg.sr})); } catch (e) {} buildMenus(); flash("profSave", "Saved ✓"); };
  $("profLoad").onclick = () => { const sp = savedProfile(); if (sp) applyProfile(sp); };
  $("refresh").onchange = e => { cfg.refresh = +e.target.value; saveCfg(); };
  $("resetPanels").onclick = () => { cfg.ph = Object.assign({}, PANE_DEF); saveCfg(); needBase = true; };
  const n = Object.keys(IMETA).filter(k => cfg.ind[k].on).length, m = PANE_ORDER.filter(k => cfg.pan[k].on).length;
  $("indBtn").textContent = `Indicators${n ? " (" + n + ")" : ""} ▾`; $("panBtn").textContent = `Panels${m ? " (" + m + ")" : ""} ▾`;
}
function settingsChanged() { PV++; saveCfg(); buildMenus(); needBase = true; }
function savedProfile() { try { return JSON.parse(localStorage.getItem("fp_profile") || "null"); } catch (e) { return null; } }
function applyProfile(src) {
  cfg.ind = merge(clone(DEF.ind), src.ind); cfg.pan = merge(clone(DEF.pan), src.pan); cfg.sr = merge(clone(DEF.sr), src.sr);
  setPop.hidden = true; settingsChanged();
}
function flash(id, txt) { const b = $(id); if (!b) return; const old = b.textContent; b.textContent = txt; setTimeout(() => { if ($(id)) $(id).textContent = old; }, 1200); }
for (const menu of [indMenu, panMenu]) {
  menu.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.on) { const [scope, key] = t.dataset.on.split(":"); (scope === "ind" ? cfg.ind : cfg.pan)[key].on = t.checked; settingsChanged(); }
  });
  menu.addEventListener("input", e => { const t = e.target; if (t.dataset.sr) { cfg.sr[t.dataset.sr] = t.value; PV++; saveCfg(); needBase = true; } });
  menu.addEventListener("click", e => { const b = e.target.closest("[data-gear]"); if (b) { e.stopPropagation(); const [scope, key] = b.dataset.gear.split(":"); openSettings(scope, key, b); } });
}
function openSettings(scope, key, anchor) {
  const meta = scope === "ind" ? IMETA[key] : PMETA[key], c = scope === "ind" ? cfg.ind[key] : cfg.pan[key];
  let h = `<h3>${meta.label(c)}</h3>`;
  for (const f of meta.fields) {
    if (f[2] === "bool") h += `<label class="f"><span>${f[1]}</span><input type="checkbox" data-b="${f[0]}"></label>`;
    else if (Array.isArray(f[2])) h += `<label class="f">${f[1]} <select data-k="${f[0]}">${f[2].map(([v, nm]) => `<option value="${v}">${nm}</option>`).join("")}</select></label>`;
    else h += `<label class="f">${f[1]} <input type="number" data-k="${f[0]}" min="${f[2]}" max="${f[3]}" step="${f[4]}"></label>`;
  }
  for (const [k, nm] of meta.colors) h += `<label class="f">${nm} <input type="color" data-c="${k}"></label>`;
  if (meta.width) h += `<label class="f">Line width <select data-w><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="3">3</option></select></label>`;
  if (meta.auto) h += `<label class="f"><span>Auto S/R colors (yellow above price, purple below)</span><input type="checkbox" data-auto></label>`;
  h += `<div class="row3" style="justify-content:space-between;margin-top:4px"><button data-reset>Reset to default</button><button data-close>Done</button></div>`;
  setPop.innerHTML = h; setPop.dataset.scope = scope; setPop.dataset.key = key;
  setPop.querySelectorAll("[data-k]").forEach(el => el.value = String(c[el.dataset.k]));
  setPop.querySelectorAll("[data-c]").forEach(el => el.value = c[el.dataset.c]);
  setPop.querySelectorAll("[data-b]").forEach(el => el.checked = !!c[el.dataset.b]);
  const w = setPop.querySelector("[data-w]"); if (w) w.value = String(c.width);
  const au = setPop.querySelector("[data-auto]"); if (au) au.checked = !!c.auto;
  setPop.hidden = false;
  const r = anchor.getBoundingClientRect(), pw = setPop.offsetWidth, ph = setPop.offsetHeight;
  setPop.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.right + 8)) + "px";
  setPop.style.top = Math.max(8, Math.min(innerHeight - ph - 8, r.top - 10)) + "px";
}
function popTarget() { const scope = setPop.dataset.scope, key = setPop.dataset.key; return {scope, key, c:(scope === "ind" ? cfg.ind : cfg.pan)[key], d:(scope === "ind" ? DEF.ind : DEF.pan)[key], meta:(scope === "ind" ? IMETA : PMETA)[key]}; }
function onPopInput(e) {
  const {c, meta} = popTarget(), t = e.target;
  if (t.dataset.k) {
    const f = meta.fields.find(x => x[0] === t.dataset.k);
    if (Array.isArray(f[2])) c[f[0]] = t.value;
    else { let v = +t.value; if (!isFinite(v) || t.value === "") return; v = Math.min(f[3], Math.max(f[2], v)); if (f[4] >= 1) v = Math.round(v); else v = Math.round(v * 10) / 10;
      if (f[0] === "ob" && v <= c.os) return; if (f[0] === "os" && v >= c.ob) return; c[f[0]] = v; }
  } else if (t.dataset.c) c[t.dataset.c] = t.value;
  else if (t.dataset.b) c[t.dataset.b] = t.checked;
  else if ("w" in t.dataset) c.width = +t.value;
  else if ("auto" in t.dataset) c.auto = t.checked;
  else return;
  setPop.querySelector("h3").textContent = meta.label(c);
  settingsChanged();
}
setPop.addEventListener("change", onPopInput);
setPop.addEventListener("input", e => { if (e.target.dataset.c) onPopInput(e); });
setPop.addEventListener("click", e => {
  e.stopPropagation();
  if (e.target.closest("[data-close]")) { setPop.hidden = true; return; }
  if (e.target.closest("[data-reset]")) { const {scope, key, c, d} = popTarget(); const on = c.on; Object.assign(c, clone(d), {on}); settingsChanged();
    openSettings(scope, key, document.querySelector(`[data-gear="${scope}:${key}"]`) || $(scope === "ind" ? "indBtn" : "panBtn")); }
});
{ const menus = [["indBtn", indMenu], ["panBtn", panMenu]].map(([b, m]) => [$(b), m]);
  for (const [btn, pop] of menus) {
    btn.onclick = e => { e.stopPropagation(); const open = pop.hidden; menus.forEach(([, q]) => q.hidden = true); setPop.hidden = true; pop.hidden = !open;
      if (!pop.hidden) { pop.style.left = "0"; pop.style.right = "auto"; const r = pop.getBoundingClientRect();   // keep the menu on screen
        if (r.right > innerWidth - 8) { pop.style.left = "auto"; pop.style.right = "0"; if (pop.getBoundingClientRect().left < 8) { pop.style.right = "auto"; pop.style.left = (8 - btn.getBoundingClientRect().left) + "px"; } } } };
    pop.addEventListener("click", e => e.stopPropagation()); }
  const closeAll = () => { menus.forEach(([, q]) => q.hidden = true); setPop.hidden = true; };
  document.addEventListener("click", closeAll);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
}

buildMenus();
window.__footprintTest = {addTrade, S, SER, FEEDS, cfg, exportJson, importJson, clearAll, setPause, PAUSE,
  layout:() => layout, redraw:() => { needBase = true; }, perf:() => { const t = performance.now(); drawBase(); const b = performance.now(); drawOverlay(); return [b - t, performance.now() - b]; }};
resize(); updateStatus();
VENUES.forEach(v => FEEDS[v].connect());
</script>
</body>
