<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Footprint</title>
<style>
:root{--bg:#0a0c10;--panel:#11141a;--line:#1f2430;--text:#c9d1d9;--muted:#6b7480;--buy:#1fa37f;--sell:#d9484a;--accent:#d8b24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0 6px 0 0;font-weight:600}
label{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
select,input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
input[type=number]{width:96px}
input[type=color]{width:34px;height:22px;padding:0 1px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer}
button{background:#1a1f2a;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4356}
button.on{background:#2a2410;border-color:#6b5a24;color:#f1d48a}
button:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:20px;background:var(--line)}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px 12px;display:grid;gap:6px;min-width:250px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.menu-pop[hidden]{display:none}
.menu-pop.wide{grid-template-columns:auto auto;column-gap:28px;align-items:start}
.menu-pop .col{display:grid;gap:6px;align-content:start}
.menu-pop label{color:var(--text);white-space:nowrap}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
.gear{padding:0 6px;font-size:13px;line-height:20px;background:none;border-color:transparent;color:var(--muted)}
.gear:hover{color:var(--text);border-color:var(--line);background:#1a1f2a}
.row3{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:11px;max-width:270px}
.stat{color:var(--text);font-size:11px;line-height:1.6;font-variant-numeric:tabular-nums}
.bad{color:#ef8a8b}.okc{color:#6cc9ae}
.mh{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#525b68;margin-top:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin:0 2px;flex:none}
#setPop{position:fixed;z-index:30;background:var(--panel);border:1px solid #2c3343;border-radius:6px;padding:10px 14px 12px;display:grid;gap:8px;min-width:260px;box-shadow:0 14px 36px rgba(0,0,0,.6)}
#setPop[hidden]{display:none}
#setPop h3{margin:0 0 2px;font-size:12.5px;font-weight:600}
#setPop .f{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--text)}
#setPop input[type=number]{width:72px}
#status{display:flex;gap:16px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#555;margin-right:4px}
.dot.ok{background:var(--buy)}.dot.wait{background:var(--accent)}.dot.err{background:var(--sell)}
.ven{display:inline-flex;align-items:center;gap:4px}
.pos{color:var(--buy)}.neg{color:var(--sell)}.warn{color:var(--accent)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{cursor:crosshair}
#ov{pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(17,20,26,.97);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:11px ui-monospace,Consolas,monospace;white-space:pre;display:none;z-index:2}
#pauseBadge{position:absolute;top:32px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(40,34,14,.95);border:1px solid #6b5a24;color:#f1d48a;padding:4px 6px 4px 12px;border-radius:16px;font-size:12px;display:none;align-items:center;gap:10px}
#pauseBadge button{padding:2px 10px;border-radius:12px}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>BTC-USD Footprint</h1>
  <label>Timeframe <select id="tf">
    <optgroup label="Developer · last 2h">
      <option value="5">5s</option><option value="10">10s</option><option value="15">15s</option><option value="30">30s</option></optgroup>
    <optgroup label="Standard">
      <option value="60">1m</option><option value="300">5m</option><option value="900">15m</option><option value="1800">30m</option><option value="3600">1h</option></optgroup></select></label>
  <label>Row <select id="row">
    <option value="auto">Auto</option><option value="5">$5</option><option value="10">$10</option>
    <option value="25">$25</option><option value="50">$50</option><option value="100">$100</option>
    <option value="250">$250</option><option value="500">$500</option></select></label>
  <label>Cells <select id="mode">
    <option value="delta">Delta</option><option value="bidask">Sell × Buy</option><option value="vol">Volume</option></select></label>
  <label>Highlight ≥ <select id="thr">
    <option value="auto">Auto</option><option value="100000">$100K</option><option value="250000">$250K</option>
    <option value="500000">$500K</option><option value="1000000">$1M</option><option value="2000000">$2M</option>
    <option value="5000000">$5M</option><option value="10000000">$10M</option></select></label>
  <label>Units <select id="units"><option value="usd">USD</option><option value="btc">BTC</option></select></label>
  <label>Profile <select id="prof">
    <option value="visible">Visible</option><option value="session">Session (UTC day)</option><option value="all">All stored</option></select></label>
  <span class="sep"></span>
  <label><input type="checkbox" id="candles"> Candles</label>
  <div class="menu"><button id="indBtn">Indicators ▾</button><div id="indMenu" class="menu-pop wide" hidden></div></div>
  <div class="menu"><button id="panBtn">Panels ▾</button><div id="panMenu" class="menu-pop" hidden></div></div>
  <label><input type="checkbox" id="abs"> Absorption</label>
  <label><input type="checkbox" id="bubbles"> Bubbles ≥ $</label>
  <input type="number" id="bigMin" min="25000" step="25000">
  <span class="sep"></span>
  <label><input type="checkbox" id="v_coinbase"> Coinbase</label>
  <label><input type="checkbox" id="v_kraken"> Kraken</label>
  <label><input type="checkbox" id="v_bitstamp"> Bitstamp</label>
  <span class="sep"></span>
  <button id="pauseBtn" title="Freeze the chart while data keeps collecting (Space)">❚❚ Pause</button>
  <button id="live">Live ⟶</button>
  <div class="menu"><button id="stoBtn">Storage ▾</button><div id="stoMenu" class="menu-pop" hidden></div></div>
  <div class="menu"><button id="expBtn">Export ▾</button><div id="expMenu" class="menu-pop" hidden></div></div>
  <button id="importBtn">Import</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button id="clear">Clear</button>
</header>
<div id="status"></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="tip"></div>
  <div id="pauseBadge"><span id="pauseTxt">Paused</span><button id="resumeBtn">Resume</button></div>
</div>
</div>
<div id="setPop" hidden></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ======================================================================
   Storage model
   Trades are aggregated on arrival into 1-minute base bars at $5 price rows.
   A display series (one entry per bar of the selected timeframe) and per-UTC-day
   stats are maintained incrementally as trades arrive, so drawing never has to
   rescan history. Large aggressive prints are kept separately for bubbles.
   ====================================================================== */
const HOUR = 3600e3, hourOf = t => Math.floor(t / HOUR) * HOUR;
const BASE_MS = 60000, FINE_MS = 5000, FINE_KEEP = 2 * 3600e3, BASE_TICK = 5, BIG_FLOOR = 25000, BIG_MAX = 60000, DAY_MS = 86400000;
const VENUES = ["coinbase", "kraken", "bitstamp"];
const VNAME = {coinbase:"Coinbase", kraken:"Kraken", bitstamp:"Bitstamp"};

/* ---------- Settings ---------- */
const DEF = {
  tfs:300, row:"auto", mode:"delta", thr:"auto", units:"usd", prof:"visible", candles:true, abs:true,
  bubbles:false, bigMin:500000, hours:24, refresh:500,
  store:"browser", retain:30, restore:true, backfill:true, seed:true, gapReset:false, loadRange:24, expRange:"mem", expSettings:true, venues:{coinbase:true, kraken:true, bitstamp:true},
  ph:{vol:72, rsi:96, cvd:64, macd:96, stoch:84},
  sr:{res:"#f5d020", sup:"#c084fc"},
  /* Default profile: Auto Fib (yellow resistance / purple support), SMA 200 (white) and RSI.
    Everything else starts off, in a cool blue/grey palette that stays
     clear of the yellow/purple support-resistance colors. */
  ind:{
    vwap:{on:false, color:"#38bdf8", width:2},
    vwapB:{on:false, m1:1, m2:2, color:"#38bdf8", width:1},
    ema1:{on:false, len:9, color:"#7dd3fc", width:1.5},
    ema2:{on:false, len:21, color:"#3b82f6", width:1.5},
    ema3:{on:false, len:50, color:"#94a3b8", width:1.5},
    ema4:{on:false, len:200, color:"#cbd5e1", width:1.5},
    sma1:{on:false, len:20, color:"#67e8f9", width:1.5},
    sma2:{on:false, len:50, color:"#0ea5e9", width:1.5},
    sma3:{on:true, len:200, color:"#ffffff", width:2},
    bb:{on:false, len:20, mult:2, color:"#64748b", width:1},
    ichi:{on:false, conv:9, base:26, spanB:52, disp:26, tenkan:"#3b82f6", kijun:"#e2e8f0", up:"#22c08f", down:"#ef5054"},
    lvOpen:{on:false, color:"#94a3b8", auto:false},
    lvDay:{on:false, color:"#e2e8f0", auto:false},
    lvPrior:{on:false, color:"#94a3b8", auto:true},
    lvPvwap:{on:false, color:"#38bdf8", auto:false},
    fib:{on:true, anchor:"visible", customH:6, res:"#f5d020", sup:"#c084fc"}
  },
  pan:{
    vol:{on:true, maLen:20, up:"#22c08f", down:"#ef5054", ma:"#94a3b8"},
    rsi:{on:true, len:14, ob:70, os:30, line:"#7dd3fc", obc:"#ef5054", osc:"#22c08f", lvl:"#4b5563", width:2, shade:false},
    cvd:{on:false, reset:"visible"},
    macd:{on:false, fast:12, slow:26, sig:9, macd:"#7dd3fc", signal:"#e2e8f0"},
    stoch:{on:false, rsiLen:14, stLen:14, k:3, d:3, ob:80, os:20, kc:"#7dd3fc", dc:"#e2e8f0"}
  }
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(dst, src) {
  if (!src || typeof src !== "object") return dst;
  for (const k in dst) {
    if (!(k in src)) continue;
    if (dst[k] && typeof dst[k] === "object") merge(dst[k], src[k]);
    else if (src[k] !== null && typeof src[k] !== "object") dst[k] = src[k];
  }
  return dst;
}
const cfg = clone(DEF);
try { merge(cfg, JSON.parse(localStorage.getItem("fp_cfg5") || "null")); } catch (e) {}
function saveCfg() { try { localStorage.setItem("fp_cfg5", JSON.stringify(cfg)); } catch (e) {} }
let PV = 0;   // bumps whenever an indicator setting changes

/* ---------- State ---------- */
const S = {bars:new Map(), keys:[], keysDirty:false, fbars:new Map(), fkeys:[], fkeysDirty:false, big:[], acc:{}, last:null, lastTs:0,
           vDelta:{}, vCount:{}, unsaved:0, total:0, dirtyData:true, rate:[],
           seen:{}, seenArr:{}, vLast:{}, loadedHours:new Set(), pendingHours:new Set(), dirtyHours:new Set(),
           gaps:[], seeds:[], hold:false, loadingMore:false, sto:{}, clk:{min:Infinity, est:null}, lastSave:0, saveErr:""};
VENUES.forEach(v => { S.vDelta[v] = 0; S.vCount[v] = 0; S.seen[v] = new Set(); S.seenArr[v] = []; });
const SER = {tfs:null, dirty:true, ver:0, live:0, T:[], O:[], H:[], L:[], C:[], F:[], Z:[], B:[], Sv:[], VU:[], dv:[], idx:new Map()};
const DAYS = new Map();          // UTC day -> {o,h,l,c,f,z,mins,sv,spv,sp2v}
const rowCache = new Map();      // display bar time -> {rs, res}
const PAUSE = {on:false, T:0, price:null, n0:0};

function addTrade(v, ts, p, q, side, id, bf) {
  if (!(p > 0 && q > 0 && isFinite(ts))) return;
  if (id != null) {   // drop exact duplicates (reconnects, overlapping backfill pages)
    const set = S.seen[v]; if (set.has(id)) return; set.add(id);
    const arr = S.seenArr[v]; arr.push(id); if (arr.length > 40000) { S.seenArr[v] = arr.slice(-20000); S.seen[v] = new Set(S.seenArr[v]); }
  }
  const t = Math.floor(ts / BASE_MS) * BASE_MS;
  let b = S.bars.get(t), newBar = false;
  if (!b) {
    b = {t, o:p, h:p, l:p, c:p, f:ts, z:ts, rows:new Map()}; S.bars.set(t, b); newBar = true;
    const ks = S.keys; if (!S.keysDirty && (!ks.length || t > ks[ks.length - 1])) ks.push(t); else S.keysDirty = true;
  }
  if (ts < b.f) { b.f = ts; b.o = p; } if (ts >= b.z) { b.z = ts; b.c = p; }
  if (p > b.h) b.h = p; if (p < b.l) b.l = p;
  const hr = hourOf(t); if (!S.loadedHours.has(hr) && !S.pendingHours.has(hr)) hourTouch(hr); S.dirtyHours.add(hr);
  const r = Math.floor(p / BASE_TICK), buy = side === "buy";
  let c = b.rows.get(r); if (!c) { c = [0, 0]; b.rows.set(r, c); }
  if (buy) c[0] += q; else c[1] += q;
  const pm = (r + 0.5) * BASE_TICK, dd = Math.floor(ts / DAY_MS);
  let D = DAYS.get(dd);
  if (!D) { D = {o:p, h:p, l:p, c:p, f:ts, z:ts, mins:0, sv:0, spv:0, sp2v:0}; DAYS.set(dd, D); }
  if (newBar) D.mins++;
  if (ts < D.f) { D.f = ts; D.o = p; } if (ts >= D.z) { D.z = ts; D.c = p; } if (p > D.h) D.h = p; if (p < D.l) D.l = p;
  D.sv += q; D.spv += pm * q; D.sp2v += pm * pm * q;
  // 5-second buffer (last 2 hours) for the developer timeframes
  const ft = Math.floor(ts / FINE_MS) * FINE_MS;
  const fineOk = ts >= Math.floor((Date.now() - FINE_KEEP) / BASE_MS) * BASE_MS;   // whole minutes only, so VWAP lines up with the 1-minute data
  let fb = fineOk ? S.fbars.get(ft) : null;
  if (fineOk) {
  if (!fb) { fb = {t:ft, o:p, h:p, l:p, c:p, f:ts, z:ts, rows:new Map()}; S.fbars.set(ft, fb);
    const fk = S.fkeys; if (!S.fkeysDirty && (!fk.length || ft > fk[fk.length - 1])) fk.push(ft); else S.fkeysDirty = true; }
  if (ts < fb.f) { fb.f = ts; fb.o = p; } if (ts >= fb.z) { fb.z = ts; fb.c = p; } if (p > fb.h) fb.h = p; if (p < fb.l) fb.l = p;
  let fc = fb.rows.get(r); if (!fc) { fc = [0, 0]; fb.rows.set(r, fc); } if (buy) fc[0] += q; else fc[1] += q;
  }
  if (!SER.dirty && SER.tfs) serAdd(ts, p, q, buy, pm, dd, D);
  if (ts >= S.lastTs) { S.lastTs = ts; S.last = p; }
  if (!S.vLast[v] || ts >= S.vLast[v].ts) S.vLast[v] = {ts, id:id == null ? null : id};
  S.vDelta[v] += buy ? q : -q; S.vCount[v]++; S.unsaved++; S.total++; S.dirtyData = true;
  if (bf) return;   // backfilled trades: large-print grouping is done by the backfill itself
  S.rate.push(Date.now());
  const a = S.acc[v];
  if (a && a.side === side && Math.abs(ts - a.ts) <= 150) { a.q += q; a.pq += p * q; }
  else { flushAcc(v); S.acc[v] = {side, ts, q, pq:p * q, at:Date.now()}; }
}
function serAdd(ts, p, q, buy, pm, dd, D) {
  const tfMs = SER.tfs * 1000, T = Math.floor(ts / tfMs) * tfMs, n = SER.T.length;
  let i = SER.idx.get(T);
  if (i === undefined) {
    if (n && T < SER.T[n - 1]) { SER.dirty = true; return; }   // rare out-of-order bar: rebuild on next draw
    i = n; SER.idx.set(T, i); SER.T.push(T); SER.O.push(p); SER.H.push(p); SER.L.push(p); SER.C.push(p);
    SER.F.push(ts); SER.Z.push(ts); SER.B.push(0); SER.Sv.push(0); SER.VU.push(0); SER.dv.push(null); SER.ver++;
  }
  if (ts < SER.F[i]) { SER.F[i] = ts; SER.O[i] = p; } if (ts >= SER.Z[i]) { SER.Z[i] = ts; SER.C[i] = p; }
  if (p > SER.H[i]) SER.H[i] = p; if (p < SER.L[i]) SER.L[i] = p;
  if (buy) SER.B[i] += q; else SER.Sv[i] += q; SER.VU[i] += q * pm;
  if (i === SER.T.length - 1) SER.dv[i] = [D.sv, D.spv, D.sp2v];
  else for (let j = i; j < SER.T.length && Math.floor(SER.T[j] / DAY_MS) === dd; j++) { const x = SER.dv[j]; if (x) { x[0] += q; x[1] += pm * q; x[2] += pm * pm * q; } }
  rowCache.delete(T); SER.live++;
}
function flushAcc(v) {
  const a = S.acc[v]; if (!a) return; S.acc[v] = null;
  if (a.pq >= BIG_FLOOR) { S.big.push({t:a.ts, p:a.pq / a.q, q:a.q, s:a.side === "buy" ? 1 : -1, v}); if (S.big.length > BIG_MAX) S.big.splice(0, S.big.length - BIG_MAX); }
}
function sortedFine() { if (S.fkeysDirty) { S.fkeys = [...S.fbars.keys()].sort((a, b) => a - b); S.fkeysDirty = false; } return S.fkeys; }
const isDev = () => cfg.tfs < 60;
function src() { return isDev() ? {bars:S.fbars, keys:sortedFine()} : {bars:S.bars, keys:sortedKeys()}; }
const tfLabel = (s => s < 60 ? s + "s" : s < 3600 ? s / 60 + "m" : s / 3600 + "h");
function sortedKeys() { if (S.keysDirty) { S.keys = [...S.bars.keys()].sort((a, b) => a - b); S.keysDirty = false; } return S.keys; }
function lowerBound(arr, x) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; } return lo; }
function lowerBig(t) { let lo = 0, hi = S.big.length; while (lo < hi) { const m = (lo + hi) >> 1; if (S.big[m].t < t) lo = m + 1; else hi = m; } return lo; }

function rebuildSeries() {
  const tfMs = cfg.tfs * 1000, st = src(), fine = isDev();
  Object.assign(SER, {tfs:cfg.tfs, dirty:false, T:[], O:[], H:[], L:[], C:[], F:[], Z:[], B:[], Sv:[], VU:[], dv:[], idx:new Map()});
  SER.ver++; SER.live++; DAYS.clear(); rowCache.clear();
  // Day stats (levels, VWAP totals) always come from the full 1-minute history. In developer
  // timeframes, VWAP picks up the day's running totals from before the 5-second buffer begins.
  const cutT = fine && st.keys.length ? Math.floor(st.keys[0] / BASE_MS) * BASE_MS : -Infinity, pre = new Map();
  for (const t of sortedKeys()) {
    const b = S.bars.get(t), dd = Math.floor(t / DAY_MS);
    let D = DAYS.get(dd);
    if (!D) { D = {o:b.o, h:b.h, l:b.l, c:b.c, f:b.f, z:b.z, mins:0, sv:0, spv:0, sp2v:0}; DAYS.set(dd, D); }
    else { if (b.h > D.h) D.h = b.h; if (b.l < D.l) D.l = b.l; if (b.f < D.f) { D.f = b.f; D.o = b.o; } if (b.z >= D.z) { D.z = b.z; D.c = b.c; } }
    D.mins++;
    for (const [r, c] of b.rows) { const pm = (r + 0.5) * BASE_TICK, v = c[0] + c[1]; D.sv += v; D.spv += pm * v; D.sp2v += pm * pm * v; }
    if (t < cutT) pre.set(dd, [D.sv, D.spv, D.sp2v]);
  }
  let day = null, cum = null;
  for (const t of st.keys) {
    const b = st.bars.get(t), T = Math.floor(t / tfMs) * tfMs, dd = Math.floor(t / DAY_MS);
    if (dd !== day) { day = dd; const p0 = fine ? pre.get(dd) : null; cum = p0 ? p0.slice() : [0, 0, 0]; }
    let i = SER.idx.get(T);
    if (i === undefined) { i = SER.T.length; SER.idx.set(T, i); SER.T.push(T); SER.O.push(b.o); SER.H.push(b.h); SER.L.push(b.l); SER.C.push(b.c);
      SER.F.push(b.f); SER.Z.push(b.z); SER.B.push(0); SER.Sv.push(0); SER.VU.push(0); SER.dv.push(null); }
    else { if (b.h > SER.H[i]) SER.H[i] = b.h; if (b.l < SER.L[i]) SER.L[i] = b.l;
      if (b.f < SER.F[i]) { SER.F[i] = b.f; SER.O[i] = b.o; } if (b.z >= SER.Z[i]) { SER.Z[i] = b.z; SER.C[i] = b.c; } }
    for (const [r, c] of b.rows) { const pm = (r + 0.5) * BASE_TICK, v = c[0] + c[1];
      SER.B[i] += c[0]; SER.Sv[i] += c[1]; SER.VU[i] += v * pm; cum[0] += v; cum[1] += pm * v; cum[2] += pm * pm * v; }

/* ---------- Backfill: recover trades missed while closed, asleep or disconnected ---------- */
const BF = {q:[], running:false, msg:""};
const BF_CAP = {kraken:7 * DAY_MS, coinbase:DAY_MS, bitstamp:DAY_MS};   // how far back each exchange's public history is fetched
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchJson(url) {
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 20000);

  finally { clearTimeout(to); }
}

  let g = S.gaps.find(x => x.t0 <= t1 + 120000 && x.t1 >= t0 - 120000);
  if (!g) { g = {t0, t1, st:{}}; S.gaps.push(g); S.gaps.sort((a, b) => a.t0 - b.t0); }
  else { g.t0 = Math.min(g.t0, t0); g.t1 = Math.max(g.t1, t1); }

}

}

function withNet(fn) { const r = netChain.then(fn, fn); netChain = r.catch(() => {}); return r; }

/* ---------- History seeding: on start (or a timeframe change), fetch enough past trades for the

   10 days; Coinbase and Bitstamp only ~24h, so older history is Kraken-only and marked on the chart. */

    let E = Infinity; for (const b of S.bars.values()) if (b.f < E) E = b.f;   // earliest trade already held

  const span = Math.max(1, toTs - from.ts); let cur = null; const prints = [];
  const ingest = (ts, p, q, side, id) => {
    if (!(ts >= from.ts && ts < toTs)) return;
    if (from.id != null && ts === from.ts && String(id) === String(from.id)) return;
    addTrade(v, ts, p, q, side, id, true);
    if (cur && cur.side === side && Math.abs(ts - cur.ts) <= 150) { cur.q += q; cur.pq += p * q; }

  };
  if (v === "kraken") {          // pages forward from a timestamp; 'last' is the cursor for the next page
    let since = String(Math.floor(from.ts / 1000));
    for (let guard = 0; guard < 20000; guard++) {
      const r = await fetchJson(`https://api.kraken.com/0/public/Trades?pair=XBTUSD&since=${since}&count=1000`);
      if (r.error && r.error.length) throw new Error(r.error.join(", "));
      const res = r.result || {}, key = Object.keys(res).find(k => k !== "last"), rows = (key && res[key]) || [];

      for (const t of rows) { const ts = Math.round(+t[2] * 1000); lastTs = ts; if (ts >= toTs) { done = true; break; } ingest(ts, +t[0], +t[1], t[3] === "b" ? "buy" : "sell", String(t[6])); }
      prog(Math.min(1, (lastTs - from.ts) / span));
      if (done || !res.last || String(res.last) === since) break;
      since = String(res.last); await sleep(1100);
    }
  } else if (v === "coinbase") {  // pages backward through a time window; side is the maker's, so flip it
    const start = Math.floor(from.ts / 1000); let end = Math.ceil(toTs / 1000);
    for (let guard = 0; guard < 5000 && end > start; guard++) {
      const r = await fetchJson(`https://api.coinbase.com/api/v3/brokerage/market/products/BTC-USD/ticker?limit=1000&start=${start}&end=${end}`);
      const tr = r.trades || []; let minT = Infinity;
      for (const t of tr) { const ts = parseTime(t.time); if (ts < minT) minT = ts; ingest(ts, +t.price, +t.size, t.side === "BUY" ? "sell" : "buy", String(t.trade_id)); }
      if (isFinite(minT)) prog(Math.min(1, (toTs - minT) / span));
      if (tr.length < 1000 || !isFinite(minT)) break;
      const ne = Math.floor(minT / 1000); end = ne < end ? ne : end - 1;
      await sleep(150);
    }
  } else if (v === "bitstamp") {  // only the last 24h are available
    const r = await fetchJson("https://www.bitstamp.net/api/v2/transactions/btcusd/?time=day");
    for (const t of Array.isArray(r) ? r : []) ingest(+t.date * 1000, +t.price, +t.amount, +t.type === 0 ? "buy" : "sell", String(t.tid));
    prog(1);
  }
  if (cur && cur.pq >= BIG_FLOOR) prints.push(cur);
  for (const a of prints) S.big.push({t:a.ts, p:a.pq / a.q, q:a.q, s:a.side === "buy" ? 1 : -1, v});
  if (prints.length) S.big.sort((a, b) => a.t - b.t);
}

}

    if (DB) await idbPut("meta", h, "dir"); await writeFolder(true); }
  catch (e) { if (e.name !== "AbortError") { FS.state = "error"; FS.err = e.message; } }
  buildStoMenu(); updateStatus();
}
async function reapproveFolder() {

}
async function writeDay(dd) {

  const fh = await FS.handle.getFileHandle(dayName(dd), {create:true}), w = await fh.createWritable();

}
async function writeFolder(force) {

}

}

  const memHours = new Set(sortedKeys().filter(t => t >= t0 && t < t1).map(hourOf));
