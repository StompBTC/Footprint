<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Footprint</title>
<style>
:root{--bg:#0a0c10;--panel:#11141a;--line:#1f2430;--text:#c9d1d9;--muted:#6b7480;--buy:#1fa37f;--sell:#d9484a;--accent:#d8b24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0 6px 0 0;font-weight:600}
label{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
select,input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
input[type=number]{width:96px}
button{background:#1a1f2a;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4356}
.sep{width:1px;height:20px;background:var(--line)}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px 10px;display:grid;gap:7px;min-width:230px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.menu-pop[hidden]{display:none}
.menu-pop label{color:var(--text)}
.mh{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#525b68;margin-top:5px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin:0 2px}
.sw.dash{height:0;border-top:2px dashed;background:none}
#status{display:flex;gap:16px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#555;margin-right:4px}
.dot.ok{background:var(--buy)}.dot.wait{background:var(--accent)}.dot.err{background:var(--sell)}
.ven{display:inline-flex;align-items:center;gap:4px}
.pos{color:var(--buy)}.neg{color:var(--sell)}.warn{color:var(--accent)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:rgba(17,20,26,.97);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:11px ui-monospace,Consolas,monospace;white-space:pre;display:none;z-index:2}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>BTC-USD Footprint</h1>
  <label>Timeframe <select id="tf">
    <option value="1">1m</option><option value="5">5m</option><option value="15">15m</option>
    <option value="30">30m</option><option value="60">1h</option></select></label>
  <label>Row <select id="row">
    <option value="auto">Auto</option><option value="5">$5</option><option value="10">$10</option>
    <option value="25">$25</option><option value="50">$50</option><option value="100">$100</option>
    <option value="250">$250</option><option value="500">$500</option></select></label>
  <label>Cells <select id="mode">
    <option value="delta">Delta</option><option value="bidask">Sell × Buy</option><option value="vol">Volume</option></select></label>
  <label>Highlight ≥ <select id="thr">
    <option value="auto">Auto</option><option value="100000">$100K</option><option value="250000">$250K</option>
    <option value="500000">$500K</option><option value="1000000">$1M</option><option value="2000000">$2M</option>
    <option value="5000000">$5M</option><option value="10000000">$10M</option></select></label>
  <label>Units <select id="units"><option value="usd">USD</option><option value="btc">BTC</option></select></label>
  <label>Profile <select id="prof">
    <option value="visible">Visible</option><option value="session">Session (UTC day)</option><option value="all">All stored</option></select></label>
  <span class="sep"></span>
  <label><input type="checkbox" id="candles"> Candles</label>
  <div class="menu"><button id="indBtn">Indicators ▾</button>
    <div id="indMenu" class="menu-pop" hidden>
      <div class="mh">VWAP (UTC day)</div>
      <label><input type="checkbox" id="vwap"><span class="sw" style="background:#f0a63a"></span>VWAP</label>
      <label><input type="checkbox" id="vwapBands"><span class="sw dash" style="border-color:#f0a63a"></span>VWAP ±1σ / ±2σ bands</label>
      <div class="mh">Moving averages</div>
      <label><input type="checkbox" id="ema9"><span class="sw" style="background:#4fa3ff"></span>EMA 9</label>
      <label><input type="checkbox" id="ema21"><span class="sw" style="background:#b07cff"></span>EMA 21</label>
      <label><input type="checkbox" id="ema50"><span class="sw" style="background:#d7dbe2"></span>EMA 50</label>
      <div class="mh">Key levels</div>
      <label><input type="checkbox" id="lvOpen"><span class="sw dash" style="border-color:#9aa4b2"></span>Day open</label>
      <label><input type="checkbox" id="lvPrior"><span class="sw dash" style="border-color:#d8b24a"></span>Prior day high / low</label>
      <label><input type="checkbox" id="lvPvwap"><span class="sw dash" style="border-color:#f0a63a"></span>Prior day VWAP</label>
      <div class="mh">Fibonacci</div>
      <label><input type="checkbox" id="fib"><span class="sw dash" style="border-color:#5ec4ff"></span>Auto Fib (visible swing)</label>
    </div>
  </div>
  <label><input type="checkbox" id="abs"> Absorption</label>
  <label><input type="checkbox" id="cvd"> CVD</label>
  <label><input type="checkbox" id="bubbles"> Bubbles ≥ $</label>
  <input type="number" id="bigMin" min="25000" step="25000">
  <span class="sep"></span>
  <label><input type="checkbox" id="v_coinbase"> Coinbase</label>
  <label><input type="checkbox" id="v_kraken"> Kraken</label>
  <label><input type="checkbox" id="v_bitstamp"> Bitstamp</label>
  <span class="sep"></span>
  <label>Keep <select id="hours">
    <option value="6">6h</option><option value="12">12h</option><option value="24">24h</option>
    <option value="48">48h</option><option value="72">72h</option></select></label>
  <button id="live">Live ⟶</button>
  <button id="exportJson">Export</button>
  <button id="exportCsv">CSV</button>
  <button id="importBtn">Import</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button id="clear">Clear</button>
</header>
<div id="status"></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="tip"></div>
</div>
</div>

<script>
"use strict";
/* ---------- Storage model ----------
   Trades are aggregated on arrival into 1-minute base bars at $5 price rows.
   Display timeframe / row size are rebuilt from these, so nothing is lost by changing them.
   Large aggressive prints (fills from one taker within 150ms) are kept separately for bubbles. */
const BASE_MS = 60000, BASE_TICK = 5, BIG_FLOOR = 25000, BIG_MAX = 60000;
const VENUES = ["coinbase", "kraken", "bitstamp"];
const VNAME = {coinbase:"Coinbase", kraken:"Kraken", bitstamp:"Bitstamp"};

const cfg = {tf:5, row:"auto", mode:"delta", thr:"auto", units:"usd", prof:"visible", candles:true, vwap:true, vwapBands:true, ema9:true, ema21:true, ema50:false, lvOpen:true, lvPrior:true, lvPvwap:false, fib:false, abs:true, cvd:true,
             bubbles:false, bigMin:500000, hours:24, venues:{coinbase:true, kraken:true, bitstamp:true}};
try { const s = JSON.parse(localStorage.getItem("fp_cfg2") || "null"); if (s) Object.assign(cfg, s, {venues:Object.assign(cfg.venues, s.venues||{})}); } catch(e) {}
function saveCfg(){ try { localStorage.setItem("fp_cfg2", JSON.stringify(cfg)); } catch(e) {} }

const S = {
  bars: new Map(), keys: [], keysDirty: false,
  big: [], acc: {}, last: null, lastTs: 0,
  vDelta: {}, vCount: {}, unsaved: 0, dirty: true, cache: new Map(), rate: []
};
VENUES.forEach(v => { S.vDelta[v] = 0; S.vCount[v] = 0; });

function addTrade(v, ts, p, q, side) {
  if (!(p > 0 && q > 0 && isFinite(ts))) return;
  const t = Math.floor(ts / BASE_MS) * BASE_MS;
  let b = S.bars.get(t);
  if (!b) { b = {t, o:p, h:p, l:p, c:p, f:ts, z:ts, rows:new Map()}; S.bars.set(t, b); S.keysDirty = true; }
  if (ts < b.f) { b.f = ts; b.o = p; }
  if (ts >= b.z) { b.z = ts; b.c = p; }
  if (p > b.h) b.h = p; if (p < b.l) b.l = p;
  const r = Math.floor(p / BASE_TICK);
  let c = b.rows.get(r); if (!c) { c = [0, 0]; b.rows.set(r, c); }
  if (side === "buy") c[0] += q; else c[1] += q;
  if (ts >= S.lastTs) { S.lastTs = ts; S.last = p; }
  S.vDelta[v] += side === "buy" ? q : -q; S.vCount[v]++;
  S.unsaved++; S.dirty = true; S.rate.push(Date.now());
  const a = S.acc[v];
  if (a && a.side === side && Math.abs(ts - a.ts) <= 150) { a.q += q; a.pq += p * q; a.ts2 = ts; }
  else { flushAcc(v); S.acc[v] = {side, ts, ts2:ts, q, pq:p*q, at:Date.now()}; }
}
function flushAcc(v) {
  const a = S.acc[v]; if (!a) return; S.acc[v] = null;
  if (a.pq >= BIG_FLOOR) { S.big.push({t:a.ts, p:a.pq / a.q, q:a.q, s:a.side === "buy" ? 1 : -1, v}); if (S.big.length > BIG_MAX) S.big.splice(0, S.big.length - BIG_MAX); }
}
function sortedKeys() { if (S.keysDirty) { S.keys = [...S.bars.keys()].sort((a, b) => a - b); S.keysDirty = false; } return S.keys; }

function prune() {
  const cut = Date.now() - cfg.hours * 3600e3;
  let n = 0;
  for (const t of S.bars.keys()) if (t < cut) { S.bars.delete(t); n++; }
  if (n) { S.keysDirty = true; S.cache.clear(); }
  if (S.big.length && S.big[0].t < cut) S.big = S.big.filter(x => x.t >= cut);
  const r = Date.now() - 60000; while (S.rate.length && S.rate[0] < r) S.rate.shift();
  S.dirty = true;
}

/* ---------- Exchange feeds (public, read-only, no keys) ---------- */
function parseTime(s) { return Date.parse(String(s).replace(/(\.\d{3})\d+/, "$1")); }
function makeFeed(name, url, subs, parse, staleMs, keepalive) {
  const f = {name, state:"off", ws:null, lastMsg:0, retry:0, timer:null, ka:null};
  f.connect = () => {
    clearTimeout(f.timer);
    if (!cfg.venues[name]) { f.state = "off"; return; }
    f.state = "wait"; let ws;
    try { ws = new WebSocket(url); } catch (e) { f.state = "err"; return f.sched(); }
    f.ws = ws;
    ws.onopen = () => { subs.forEach(m => ws.send(JSON.stringify(m))); f.lastMsg = Date.now(); f.retry = 0;
      if (keepalive) { clearInterval(f.ka); f.ka = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify(keepalive)); }, 20000); } };
    ws.onmessage = e => { if (f.ws !== ws) return; f.lastMsg = Date.now(); let m; try { m = JSON.parse(e.data); } catch (x) { return; } f.state = "ok"; parse(m, f); };
    ws.onerror = () => { if (f.ws === ws) f.state = "err"; };
    ws.onclose = () => { if (f.ws !== ws) return; f.ws = null; clearInterval(f.ka); f.state = "err"; f.sched(); };
  };
  f.sched = () => { clearTimeout(f.timer); const d = Math.min(30000, 1000 * 2 ** f.retry++); f.timer = setTimeout(f.connect, d); };
  f.close = () => { f.state = "off"; clearTimeout(f.timer); clearInterval(f.ka); if (f.ws) { const w = f.ws; f.ws = null; try { w.close(); } catch (e) {} } };
  f.reconnect = () => { f.close(); f.connect(); };
  f.staleMs = staleMs;
  return f;
}

const FEEDS = {
  // Coinbase Advanced Trade: "side" is the MAKER side, so the aggressor is the opposite.
  coinbase: makeFeed("coinbase", "wss://advanced-trade-ws.coinbase.com",
    [{type:"subscribe", channel:"market_trades", product_ids:["BTC-USD"]}, {type:"subscribe", channel:"heartbeats"}],
    m => { if (m.channel !== "market_trades") return;
      for (const ev of m.events || []) { if (ev.type !== "update") continue;
        for (const t of ev.trades || []) addTrade("coinbase", parseTime(t.time), +t.price, +t.size, t.side === "BUY" ? "sell" : "buy"); } },
    60000),
  // Kraken WS v2: "side" is the TAKER side.
  kraken: makeFeed("kraken", "wss://ws.kraken.com/v2",
    [{method:"subscribe", params:{channel:"trade", symbol:["BTC/USD"], snapshot:false}}],
    m => { if (m.channel !== "trade" || m.type !== "update") return;
      for (const t of m.data || []) addTrade("kraken", parseTime(t.timestamp), +t.price, +t.qty, t.side === "buy" ? "buy" : "sell"); },
    60000),
  // Bitstamp WS v2: type 0 = buy taker, 1 = sell taker (verify with the per-venue delta readout).
  bitstamp: makeFeed("bitstamp", "wss://ws.bitstamp.net",
    [{event:"bts:subscribe", data:{channel:"live_trades_btcusd"}}],
    (m, f) => { if (m.event === "bts:request_reconnect") { f.reconnect(); return; }
      if (m.event !== "trade" || !m.data || m.data.price == null) return;
      const d = m.data, ts = d.microtimestamp ? Math.floor(+d.microtimestamp / 1000) : +d.timestamp * 1000;
      addTrade("bitstamp", ts, +d.price, +d.amount, +d.type === 0 ? "buy" : "sell"); },
    120000, {event:"bts:heartbeat"})
};

setInterval(() => {
  const now = Date.now();
  for (const v of VENUES) {
    const f = FEEDS[v];
    if (f.ws && f.lastMsg && now - f.lastMsg > f.staleMs) f.reconnect();
    const a = S.acc[v]; if (a && now - a.at > 1000) flushAcc(v);
  }
  updateStatus();
}, 1000);
setInterval(prune, 60000);

/* ---------- Display aggregation ---------- */
function lowerBound(arr, x) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; } return lo; }
function displayBuckets() {
  const tfMs = cfg.tf * 60000, out = []; let prev = null;
  for (const k of sortedKeys()) { const T = Math.floor(k / tfMs) * tfMs; if (T !== prev) { out.push(T); prev = T; } }
  return out;
}
function ohlc(T) {
  const tfMs = cfg.tf * 60000, keys = sortedKeys();
  let i = lowerBound(keys, T), r = null;
  for (; i < keys.length && keys[i] < T + tfMs; i++) {
    const b = S.bars.get(keys[i]);
    if (!r) r = {T, o:b.o, h:b.h, l:b.l, c:b.c}; else { if (b.h > r.h) r.h = b.h; if (b.l < r.l) r.l = b.l; r.c = b.c; }
  }
  return r;
}
function rangeRows(t0, t1, rs) {
  const keys = sortedKeys(), rows = new Map(); let buy = 0, sell = 0;
  for (let i = lowerBound(keys, t0); i < keys.length && keys[i] < t1; i++) {
    for (const [r, c] of S.bars.get(keys[i]).rows) {
      const d = Math.floor(r * BASE_TICK / rs); let x = rows.get(d); if (!x) { x = [0, 0]; rows.set(d, x); }
      x[0] += c[0]; x[1] += c[1]; buy += c[0]; sell += c[1];
    }
  }
  return {rows, buy, sell};
}
function aggregate(T, rs) {
  const tfMs = cfg.tf * 60000, live = T + tfMs > Date.now() - 180000, ck = cfg.tf + "|" + rs + "|" + T;
  if (!live && S.cache.has(ck)) return S.cache.get(ck);
  const res = rangeRows(T, T + tfMs, rs);
  let pv = -1; res.poc = null; for (const [d, x] of res.rows) if (x[0] + x[1] > pv) { pv = x[0] + x[1]; res.poc = d; }
  if (!live) { S.cache.set(ck, res); if (S.cache.size > 4000) S.cache.clear(); }
  return res;
}
let profCache = {k:"", at:0, rows:null};
function scopedProfile(rs) {
  const keys = sortedKeys(); if (!keys.length) return new Map();
  const t0 = cfg.prof === "session" ? Math.floor(Date.now() / 86400000) * 86400000 : 0;
  const k = cfg.prof + "|" + rs + "|" + keys.length + "|" + t0;
  if (profCache.k === k && Date.now() - profCache.at < 2000) return profCache.rows;
  profCache = {k, at:Date.now(), rows:rangeRows(t0, Infinity, rs).rows};
  return profCache.rows;
}

/* ---------- Indicators ----------
   VWAP resets each UTC day and uses every row's traded volume (±1σ/±2σ = volume-weighted std dev).
   EMAs run on display-bar closes. Day stats feed the key levels (open, prior-day high/low/VWAP). */
let indCache = {k:"", at:0, v:null};
function ema(arr, n) { const k = 2 / (n + 1), out = []; let e = null; for (const x of arr) { e = e === null ? x : x * k + e * (1 - k); out.push(e); } return out; }
function computeIndicators(buckets) {
  const keys = sortedKeys(), tfMs = cfg.tf * 60000, k = cfg.tf + "|" + keys.length + "|" + buckets.length;
  if (indCache.k === k && Date.now() - indCache.at < 1000) return indCache.v;
  const vw = new Map(), days = new Map(); let day = null, sv = 0, spv = 0, sp2v = 0;
  for (const t of keys) {
    const b = S.bars.get(t), dd = Math.floor(t / 86400000);
    if (dd !== day) { day = dd; sv = spv = sp2v = 0; days.set(dd, {o:b.o, h:b.h, l:b.l, c:b.c, vwap:null, mins:0}); }
    const D = days.get(dd); if (b.h > D.h) D.h = b.h; if (b.l < D.l) D.l = b.l; D.c = b.c; D.mins++;
    for (const [r, c] of b.rows) { const p = (r + 0.5) * BASE_TICK, v = c[0] + c[1]; sv += v; spv += p * v; sp2v += p * p * v; }
    if (sv > 0) { const m = spv / sv; vw.set(t, [m, Math.sqrt(Math.max(0, sp2v / sv - m * m))]); D.vwap = m; }
  }
  const closes = [], vwB = [];
  for (const T of buckets) { const t = keys[lowerBound(keys, T + tfMs) - 1]; closes.push(S.bars.get(t).c); vwB.push(vw.get(t) || null); }
  const v = {vwB, days, e9:ema(closes, 9), e21:ema(closes, 21), e50:ema(closes, 50)};
  indCache = {k, at:Date.now(), v};
  return v;
}

/* ---------- Formatting ---------- */
function fmtUsd(x) {
  const a = Math.abs(x), s = x < 0 ? "-" : "";
  if (a >= 1e9) return s + (a / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e3) return s + Math.round(a / 1e3) + "K";
  return Math.round(a) === 0 ? "0" : s + Math.round(a);
}
function fmtBtc(x) { const a = Math.abs(x); return (x < 0 ? "-" : "") + (a >= 100 ? a.toFixed(0) : a >= 10 ? a.toFixed(1) : a >= 1 ? a.toFixed(2) : a.toFixed(3)); }
function fmtAmt(btc, px) { return cfg.units === "usd" ? fmtUsd(btc * px) : fmtBtc(btc); }
function fmtPx(p) { return p.toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:0}); }
function hhmm(t) { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function pct(sorted, q) { return sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))] : 0; }

/* ---------- Rendering ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), tip = document.getElementById("tip");
const C = {buy:"#1fa37f", sell:"#d9484a", buyHi:"#22c08f", sellHi:"#ef5054", text:"#c9d1d9", muted:"#6b7480",
           grid:"#151922", line:"#1f2430", accent:"#d8b24a", bg:"#0a0c10", cell:"#131821", mono:"ui-monospace,Consolas,monospace"};
const AXIS_W = 70, GAP = 28, PROF_W = 176, TIME_H = 22, DELTA_H = 54, CVD_H = 64, TOP = 26, COL_GAP = 8;
let W = 0, H = 0, DPR = 1;
const view = {barW:60, offset:0};
let mouse = null, layout = null;

function resize() { DPR = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); S.dirty = true; }
window.addEventListener("resize", resize);
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Three-tier cell styling: strong (≥ threshold) solid, medium tinted, weak dark.
function tier(absUsd, thr) { return absUsd >= thr ? 2 : absUsd >= thr * 0.4 ? 1 : 0; }
function cellFill(sign, t, vol) {
  if (vol) return t === 2 ? "rgba(70,120,220,.9)" : t === 1 ? "rgba(70,120,220,.32)" : C.cell;
  const base = sign >= 0 ? C.buy : C.sell;
  return t === 2 ? rgba(base, 0.92) : t === 1 ? rgba(base, 0.30) : C.cell;
}
function cellText(sign, t) { return t === 2 ? "#ffffff" : t === 1 ? "#dfe5ec" : sign >= 0 ? "#5f9d8d" : "#a76a6b"; }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const cvdH = cfg.cvd ? CVD_H : 0;
  const cx1 = W - AXIS_W - PROF_W - GAP, cy0 = TOP, cy1 = H - TIME_H - DELTA_H - cvdH, chH = cy1 - cy0;
  const px0 = cx1 + GAP, axX = px0 + PROF_W;
  layout = null;
  const buckets = displayBuckets();
  if (!buckets.length || cx1 < 120 || chH < 60) {

  ctx.fillText(`Row $${rs}${cfg.row === "auto" ? " (auto)" : ""} · ${cfg.tf}m · ${cfg.mode === "delta" ? "Delta" : cfg.mode === "vol" ? "Volume" : "Sell × Buy"} in ${cfg.units.toUpperCase()} · highlight ≥ ${fmtUsd(thr)}${view.offset ? " · paused (double-click for live)" : ""}`, 10, TOP / 2);

  // indicator legend
  { const items = [];
    if (cfg.vwap || cfg.vwapBands) items.push([cfg.vwap && cfg.vwapBands ? "VWAP ±1σ/2σ" : cfg.vwap ? "VWAP" : "VWAP bands", "#f0a63a"]);
    if (cfg.ema9) items.push(["EMA 9", "#4fa3ff"]); if (cfg.ema21) items.push(["EMA 21", "#b07cff"]); if (cfg.ema50) items.push(["EMA 50", "#d7dbe2"]);
    if (cfg.lvOpen) items.push(["Day open", "#9aa4b2"]); if (cfg.lvPrior) items.push(["Prior day H/L", "#d8b24a"]); if (cfg.lvPvwap) items.push(["Prior VWAP", "#f0a63a"]);
    if (cfg.fib) items.push(["Auto Fib", "#5ec4ff"]);
    ctx.font = "10.5px system-ui"; ctx.textAlign = "left"; let lx = cx1 - items.reduce((a, it) => a + ctx.measureText(it[0]).width + 26, 0);
    for (const [name, color] of items) { ctx.fillStyle = color; ctx.fillRect(lx, TOP / 2 - 1, 12, 2.5); ctx.fillStyle = C.muted; ctx.fillText(name, lx + 16, TOP / 2); lx += ctx.measureText(name).width + 26; } }
  layout = {cols, rs, y, lo, hi, cx1, cy0, cy1, thr, cw, inv:yy => lo + (cy1 - yy) / ppd};
  drawCrosshair();
}

function drawCrosshair() {
  if (!mouse || !layout) { tip.style.display = "none"; return; }
  const L = layout, {x, y: my} = mouse;
  if (x > L.cx1 || my < L.cy0 || my > L.cy1) { tip.style.display = "none"; return; }
  const price = L.inv(my), d = Math.floor(price / L.rs);
  ctx.strokeStyle = "rgba(200,210,220,.3)"; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, my + 0.5); ctx.lineTo(W - AXIS_W, my + 0.5); ctx.moveTo(x + 0.5, L.cy0); ctx.lineTo(x + 0.5, L.cy1); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#2b3242"; roundRect(W - AXIS_W + 2, my - 9, AXIS_W - 4, 18, 3); ctx.fill(); ctx.fillStyle = C.text; ctx.textAlign = "left";
  ctx.font = "11px " + C.mono; ctx.fillText(fmtPx(price), W - AXIS_W + 8, my + 0.5);
  const o = L.cols.find(c => x >= c.x && x < c.x + view.barW);
  if (!o) { tip.style.display = "none"; return; }
  const v = o.agg.rows.get(d) || [0, 0], mid = d * L.rs + L.rs / 2;
  tip.textContent =
`${new Date(o.T).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"})}  (${cfg.tf}m)
Row ${fmtPx(d * L.rs)}–${fmtPx((d + 1) * L.rs)}${o.abs && o.abs.includes(d) ? "   ⚑ possible absorption" : ""}
  Buy   ${fmtBtc(v[0]).padStart(9)} BTC  ${fmtUsd(v[0] * mid)}
  Sell  ${fmtBtc(v[1]).padStart(9)} BTC  ${fmtUsd(v[1] * mid)}
  Delta ${fmtBtc(v[0] - v[1]).padStart(9)} BTC  ${fmtUsd((v[0] - v[1]) * mid)}
Bar  O ${fmtPx(o.o)}  H ${fmtPx(o.h)}  L ${fmtPx(o.l)}  C ${fmtPx(o.c)}
  Delta ${fmtBtc(o.del)} BTC (${fmtUsd(o.delUsd)}) · Vol ${fmtBtc(o.agg.buy + o.agg.sell)} BTC`;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const right = o.x + view.barW + 62;  // keep the tooltip beside the hovered column so its candle stays visible
  tip.style.left = (right + tw <= L.cx1 ? right : Math.max(4, o.x - tw - 10)) + "px";
  tip.style.top = Math.min(H - th - 4, my + 12) + "px";
}

let lastDraw = 0;
(function loop(now) { if (S.dirty && now - lastDraw > 200) { S.dirty = false; lastDraw = now; draw(); } requestAnimationFrame(loop); })(0);

/* ---------- Interaction ---------- */
let drag = null;
cv.addEventListener("wheel", e => { e.preventDefault(); view.barW = Math.min(220, Math.max(16, view.barW * (e.deltaY < 0 ? 1.12 : 1 / 1.12))); S.dirty = true; }, {passive:false});
cv.addEventListener("mousedown", e => { drag = {x:e.clientX, off:view.offset}; });
window.addEventListener("mouseup", () => { drag = null; });
cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); mouse = {x:e.clientX - r.left, y:e.clientY - r.top};
  if (drag) view.offset = Math.max(0, drag.off + (e.clientX - drag.x) / view.barW); S.dirty = true; });
cv.addEventListener("mouseleave", () => { mouse = null; S.dirty = true; });
cv.addEventListener("dblclick", () => { view.offset = 0; S.dirty = true; });

/* ---------- Status bar ---------- */
const statusEl = document.getElementById("status");
function updateStatus() {
  const parts = VENUES.map(v => { const f = FEEDS[v], dl = S.vDelta[v];
    return `<span class="ven"><span class="dot ${f.state}"></span>${VNAME[v]} ${S.vCount[v].toLocaleString()} trades · Δ <span class="${dl >= 0 ? "pos" : "neg"}">${fmtBtc(dl)} BTC</span></span>`; });
  const mins = S.bars.size;
  parts.push(`<span>${S.rate.length}/min</span>`);
  parts.push(`<span>${mins ? (mins >= 60 ? (mins / 60).toFixed(1) + "h" : mins + "m") : "0m"} stored</span>`);
  parts.push(`<span class="${S.unsaved ? "warn" : ""}">${S.unsaved ? S.unsaved.toLocaleString() + " trades since last export" : "All exported"}</span>`);
  parts.push(`<span style="margin-left:auto">Scroll: zoom · Drag: pan · Double-click: live</span>`);
  statusEl.innerHTML = parts.join("");
}

/* ---------- Export / import ---------- */
function stamp() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function exportJson() {
  VENUES.forEach(flushAcc);
  const bars = sortedKeys().map(t => { const b = S.bars.get(t); return [b.t, b.o, b.h, b.l, b.c, b.f, b.z, [...b.rows].map(([r, c]) => [r, +c[0].toFixed(8), +c[1].toFixed(8)])]; });
  const data = {app:"btc-footprint", version:1, symbol:"BTC-USD", exportedAt:new Date().toISOString(), baseMs:BASE_MS, baseTick:BASE_TICK,
    venues:VENUES.filter(v => cfg.venues[v]), bars, big:S.big.map(b => [b.t, +b.p.toFixed(2), +b.q.toFixed(8), b.s, b.v])};
  download(`btc-footprint-${stamp()}.json`, JSON.stringify(data), "application/json");
  S.unsaved = 0; updateStatus();
}
function exportCsv() {
  const lines = ["minute_utc,price_row_low,price_row_high,buy_btc,sell_btc,delta_btc"];
  for (const t of sortedKeys()) { const iso = new Date(t).toISOString();
    for (const [r, c] of [...S.bars.get(t).rows].sort((a, b) => a[0] - b[0]))
      lines.push(`${iso},${r * BASE_TICK},${(r + 1) * BASE_TICK},${c[0].toFixed(8)},${c[1].toFixed(8)},${(c[0] - c[1]).toFixed(8)}`); }
  download(`btc-footprint-${stamp()}.csv`, lines.join("\n"), "text/csv");
}
function importJson(text) {
  let d; try { d = JSON.parse(text); } catch (e) { alert("That file isn't valid JSON."); return; }
  if (!d || d.app !== "btc-footprint" || d.baseMs !== BASE_MS || d.baseTick !== BASE_TICK || !Array.isArray(d.bars)) { alert("That file isn't a BTC Footprint export."); return; }
  let added = 0, skipped = 0;
  for (const a of d.bars) {
    if (!Array.isArray(a) || a.length < 8) continue;
    const [t, o, h, l, c, f, z, rows] = a, ex = S.bars.get(t);
    const vol = rows.reduce((s, r) => s + r[1] + r[2], 0);
    if (ex) { let ev = 0; for (const x of ex.rows.values()) ev += x[0] + x[1]; if (ev >= vol) { skipped++; continue; } }
    S.bars.set(t, {t, o, h, l, c, f, z, rows:new Map(rows.map(r => [r[0], [r[1], r[2]]]))}); added++;
  }
  const seen = new Set(S.big.map(b => b.t + "|" + b.v + "|" + b.q.toFixed(8)));
  for (const b of d.big || []) { const k = b[0] + "|" + b[4] + "|" + (+b[2]).toFixed(8); if (seen.has(k)) continue; seen.add(k); S.big.push({t:b[0], p:b[1], q:b[2], s:b[3], v:b[4]}); }
  S.big.sort((a, b) => a.t - b.t);
  S.keysDirty = true; S.cache.clear(); profCache.k = ""; indCache.k = ""; S.dirty = true;
  const keys = sortedKeys(); if (keys.length) { const lb = S.bars.get(keys[keys.length - 1]); if (lb.z > S.lastTs) { S.lastTs = lb.z; S.last = lb.c; } }
  const oldest = keys.length ? new Date(keys[0]) : null;
  if (oldest && oldest < Date.now() - cfg.hours * 3600e3) alert(`Imported ${added} minutes (${skipped} overlapping minutes kept from memory).\nNote: your "Keep" setting is ${cfg.hours}h, so data older than that will be pruned within a minute. Raise "Keep" to hold older history.`);
  else alert(`Imported ${added} minutes (${skipped} overlapping minutes kept from memory).`);
}
document.getElementById("exportJson").onclick = exportJson;
document.getElementById("exportCsv").onclick = exportCsv;
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(importJson); e.target.value = ""; };
document.getElementById("clear").onclick = () => { if (!confirm("Clear all collected data from this page? Export first if you want to keep it.")) return;
  S.bars.clear(); S.big = []; S.keysDirty = true; S.cache.clear(); profCache.k = ""; indCache.k = ""; S.unsaved = 0; VENUES.forEach(v => { S.vDelta[v] = 0; S.vCount[v] = 0; }); S.dirty = true; updateStatus(); };
document.getElementById("live").onclick = () => { view.offset = 0; S.dirty = true; };
window.addEventListener("beforeunload", e => { if (S.unsaved > 0) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Controls ---------- */
function bind(id, key, conv, after) { const el = document.getElementById(id), isCb = el.type === "checkbox";
  if (isCb) el.checked = !!cfg[key]; else el.value = String(cfg[key]);
  el.onchange = () => { cfg[key] = isCb ? el.checked : conv(el.value); saveCfg(); S.cache.clear(); profCache.k = ""; indCache.k = ""; S.dirty = true; if (after) after(); }; }
bind("tf", "tf", Number); bind("row", "row", v => v); bind("mode", "mode", v => v); bind("units", "units", v => v);
bind("thr", "thr", v => v === "auto" ? "auto" : Number(v)); bind("prof", "prof", v => v);
bind("candles", "candles"); ["vwap","vwapBands","ema9","ema21","ema50","lvOpen","lvPrior","lvPvwap","fib"].forEach(k => bind(k, k, null, indLabel));
function indLabel() { const n = ["vwap","vwapBands","ema9","ema21","ema50","lvOpen","lvPrior","lvPvwap","fib"].filter(k => cfg[k]).length;
  document.getElementById("indBtn").textContent = `Indicators${n ? " (" + n + ")" : ""} ▾`; }
indLabel();
{ const btn = document.getElementById("indBtn"), pop = document.getElementById("indMenu");
  btn.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; };
  pop.onclick = e => e.stopPropagation();
  document.addEventListener("click", () => { pop.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") pop.hidden = true; }); } bind("abs", "abs"); bind("cvd", "cvd"); bind("bubbles", "bubbles");
bind("bigMin", "bigMin", v => Math.max(BIG_FLOOR, Number(v) || 500000), () => { document.getElementById("bigMin").value = cfg.bigMin; });
bind("hours", "hours", Number, prune);
VENUES.forEach(v => { const el = document.getElementById("v_" + v); el.checked = !!cfg.venues[v];
  el.onchange = () => { cfg.venues[v] = el.checked; saveCfg(); if (el.checked) FEEDS[v].connect(); else FEEDS[v].close(); updateStatus(); }; });

window.__footprintTest = {addTrade, S, FEEDS, cfg, exportJson, importJson};  // used only for offline testing
resize(); updateStatus();
VENUES.forEach(v => FEEDS[v].connect());
</script>
